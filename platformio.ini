; Éclairage du poulailler, ESP32-C3 Super Mini

[platformio]
; « pio run » et « pio run -t upload » visent la carte par défaut.
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; La Super Mini passe par l'USB natif de la puce (pas de convertisseur USB-série).
; Sans ces deux options, le moniteur série reste muet.
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = time

; Tests de la logique pure, exécutés sur le Mac sans la carte :
;   pio test -e native
[env:native]
platform = native
test_framework = unity
